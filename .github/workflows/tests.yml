name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run protocol unit tests
        run: python -m unittest tests.test_protocol -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: pip install ruff mypy
      - name: ruff
        run: ruff check custom_components tests
      - name: mypy --strict on _protocol.py
        # Only the pure-Python protocol module is strict-gated. HA-touching
        # modules cascade into 'subclass of Any' errors without the HA stubs
        # available in CI; not worth the type-ignore noise here.
        run: mypy --strict --follow-imports=silent custom_components/powerpal_ble/_protocol.py

  syntax-and-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile all Python files
        run: python -m compileall -q custom_components tests
      - name: Validate JSON files
        run: |
          python -c "import json; json.load(open('hacs.json'))"
          python -c "import json; json.load(open('custom_components/powerpal_ble/manifest.json'))"
          python -c "import json; json.load(open('custom_components/powerpal_ble/strings.json'))"

  hacs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Not yet in the home-assistant/brands registry — submitting a
          # brands PR is the path to removing this ignore.
          ignore: brands
